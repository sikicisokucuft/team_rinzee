    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f0f7ff; /* Softer light blue background */
        color: #1e293b; /* Slate 800 for text */
        overflow-x: hidden;
      }
      .font-display {
        font-family: 'Inter', sans-serif;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: -0.02em;
      }
      .brand-text {
        background: linear-gradient(135deg, #1d4ed8, #0284c7); /* High-contrast soft blue to sky gradient */
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .brand-border {
        border-color: #3b82f6;
      }
      .brand-bg {
        background: linear-gradient(135deg, #2563eb, #0284c7); /* Vibrant soft blue gradient */
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f0f7ff;
      }
      ::-webkit-scrollbar-thumb {
        background: #bfdbfe; /* Blue 200 */
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #93c5fd; /* Blue 300 */
      }
      @keyframes bounce-subtle {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      .animate-bounce-subtle {
        animation: bounce-subtle 3s ease-in-out infinite;
      }
      @keyframes shimmer {
        100% {
          transform: translateX(100%);
        }
      }
      .animate-shimmer {
        animation: shimmer 1.6s infinite;
      }
    </style>
